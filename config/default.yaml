app:
  name: "Aether"
  version: "0.2.0"
  tick_rate: 30

logging:
  level: "INFO"
  console: true
  file: "logs/aether.log"

event_bus:
  queued: true

plugins:
  - module: "aether.plugins.memory_plugin"
    class: "MemoryPlugin"
    enabled: true
  - module: "aether.plugins.history_plugin"
    class: "HistoryPlugin"
    enabled: true
  - module: "aether.plugins.system_plugin"
    class: "SystemPlugin"
    enabled: true
  - module: "aether.plugins.keyboard_plugin"
    class: "KeyboardInputPlugin"
    enabled: true
  - module: "aether.plugins.gui_plugin"
    class: "GUIPlugin"
    enabled: true