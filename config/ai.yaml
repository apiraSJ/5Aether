# AI configuration — loaded by AIPlugin (merged over the base config).
# Provider details live here; default.yaml/vision.yaml only enable the
# capability. No secrets in YAML — use api_key_env to point at an env var.

ai:
  enabled: true
  provider: echo

  system_prompt: "You are Aether, the spatial AI operating system. Answer concisely."
  max_tool_rounds: 5

  context:
    # ContextEngine settings (Phase 3.1/3.2).
    # include_vision only enables reading an already-running OverlayModel;
    # it never starts the camera or any CV stack.
    # max_memory_chars is the deterministic prompt-budget for the [Memory] block.
    max_memory: 5
    include_vision: false
    max_memory_chars: 1500

  intent:
    # Phase 3.3 Intent/Reasoning routing layer.
    # enabled: false restores exact pre-3.3 chat behavior (always agent loop).
    # classifier is rule_based (deterministic, no LLM call, <2ms).
    # max_clarification_turns guards how many follow-up questions are asked.
    enabled: true
    classifier: rule_based
    max_clarification_turns: 2

  echo:
    # Phase 1.5: deterministic offline backend. No configuration needed.

  openai:
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY

  local:
    model_path: models/llama-3.2-3b-instruct-q4_k_m.gguf
    n_ctx: 4096
