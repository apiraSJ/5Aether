<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aether Mark-1 — Tasks</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Aether Mark-1</h1>
    <p class="subtitle">Task &amp; Calendar Assistant</p>
  </header>

  <main>
    <nav class="tabs" aria-label="Views">
      <button type="button" id="tab-list" class="tab active">List</button>
      <button type="button" id="tab-calendar" class="tab">Calendar</button>
    </nav>

    <div id="list-view">
    <section class="panel">
      <div class="panel-head">
        <h2 id="form-title">New task</h2>
        <button id="cancel-btn" type="button" hidden>Cancel edit</button>
      </div>

      <div id="error-banner" class="error-banner" hidden></div>

      <form id="task-form" class="task-form">
        <div class="form-row">
          <label>
            Kind
            <select id="f-kind" name="kind">
              <option value="task">task</option>
              <option value="event">event</option>
            </select>
          </label>
          <label class="grow">
            Title *
            <input id="f-title" name="title" type="text" maxlength="500" required
                   placeholder="e.g. Send weekly report">
          </label>
          <label>
            Timezone
            <select id="f-tz" name="tz">
              <option value="Asia/Bangkok">Asia/Bangkok</option>
              <option value="UTC">UTC</option>
            </select>
          </label>
        </div>

        <div class="form-row">
          <label id="task-field">
            Due date
            <input id="f-due" name="due_date" type="date">
          </label>
          <label id="event-field" hidden>
            Start
            <input id="f-start" name="start_at" type="datetime-local">
          </label>
          <label id="event-field-2" hidden>
            End
            <input id="f-end" name="end_at" type="datetime-local">
          </label>
        </div>

        <div class="form-row">
          <label class="grow">
            Description
            <textarea id="f-desc" name="description" rows="2"
                      placeholder="Optional details"></textarea>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" id="save-btn">Add task</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Tasks</h2>
        <button id="refresh-btn" type="button">Refresh</button>
      </div>

      <div id="list-error" class="error-banner" hidden></div>

      <table id="task-table" class="task-table" hidden>
        <thead>
          <tr>
            <th>Title</th>
            <th>Due / Start</th>
            <th>Kind</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="task-list"></tbody>
      </table>

      <p id="empty-state" class="muted" hidden>No tasks yet.</p>
      <p id="loading-state" class="muted">Loading…</p>
    </section>
    </div>

    <div id="calendar-view" hidden>
      <section class="panel">
        <div class="panel-head cal-head">
          <button id="cal-prev" type="button" aria-label="Previous month">◀</button>
          <h2 id="cal-label">Month</h2>
          <div class="cal-head-right">
            <button id="cal-today" type="button">Today</button>
            <button id="cal-next" type="button" aria-label="Next month">▶</button>
          </div>
        </div>

        <div id="list-error-cal" class="error-banner" hidden></div>

        <div id="cal-grid" class="cal-grid" aria-label="Month grid"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="cal-day-label">Pick a day</h2>
        </div>
        <ul id="cal-day-items" class="cal-day-items"></ul>
        <p id="cal-day-empty" class="muted" hidden>No items on this day.</p>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <a href="/health">health</a> · <a href="/docs">api docs</a>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
