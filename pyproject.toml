[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.2.0"
description = "Command-Driven Spatial AI Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "PyYAML>=6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",
]
perception = [
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "ultralytics>=8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
full = [
    "aether[gui,perception,dev]",
]

[project.scripts]
aether = "aether.__main__:main"

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
